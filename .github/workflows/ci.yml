name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            scripts/package.sh "$GITHUB_REF_NAME"
          else
            scripts/package.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CS2Votes
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CS2Votes
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "CS2Votes ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag